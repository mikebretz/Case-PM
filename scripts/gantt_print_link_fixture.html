<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print Link Align Fixture</title>
    <style>
        .print-schedule-wrap { position: relative; width: 100%; }
        .schedule-print-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-family: Arial, sans-serif;
            font-size: 8pt;
        }
        .schedule-print-table th,
        .schedule-print-table td {
            border: 1px solid #999;
            padding: 3px 5px;
            vertical-align: middle;
            height: 24px;
        }
        .print-bar-cell {
            padding: 1px 0 !important;
            position: relative;
            border-left: 1px solid #999 !important;
        }
        .print-ts-row td { padding: 0 !important; }
        .print-timescale { position: relative; height: 14px; background: #eee; }
        .print-bar-track { position: relative; width: 100%; height: 16px; }
        .print-bar {
            position: absolute;
            top: 3px;
            height: 10px;
            background: #2563eb;
        }
        .print-inline-links {
            position: absolute;
            top: 0;
            left: var(--print-cols-width, 0);
            right: 0;
            bottom: 0;
            width: auto;
            height: auto;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="print-schedule-wrap" id="wrap" style="--print-cols-width:200px">
        <svg class="print-inline-links" viewBox="0 0 100 100" preserveAspectRatio="none">
            <path d="M 40 60 L 43 60 L 43 75 L 55 75" fill="none" stroke="#b0b0b0" stroke-width="1.2"/>
        </svg>
        <table class="schedule-print-table">
            <colgroup>
                <col style="width:120px">
                <col style="width:80px">
                <col class="print-bar-col">
            </colgroup>
            <thead>
                <tr>
                    <th>Activity</th>
                    <th>Duration</th>
                    <th class="print-bar-cell">Schedule Bars</th>
                </tr>
                <tr class="print-ts-row">
                    <td colspan="2"></td>
                    <td class="print-bar-cell"><div class="print-timescale"></div></td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Task A</td>
                    <td>5d</td>
                    <td class="print-bar-cell"><div class="print-bar-track"><div class="print-bar" style="left:10%;width:30%"></div></div></td>
                </tr>
                <tr>
                    <td>Task B</td>
                    <td>8d</td>
                    <td class="print-bar-cell"><div class="print-bar-track"><div class="print-bar" style="left:45%;width:25%"></div></div></td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        function syncPrintLinkOverlay(wrap) {
            const svg = wrap.querySelector('.print-inline-links');
            const table = wrap.querySelector('.schedule-print-table');
            const wrapRect = wrap.getBoundingClientRect();
            const tableRect = table.getBoundingClientRect();
            const cells = table.querySelectorAll('.print-bar-cell');
            let barLeft = Infinity;
            let barRight = -Infinity;
            cells.forEach(cell => {
                const r = cell.getBoundingClientRect();
                if (r.width < 1) return;
                barLeft = Math.min(barLeft, r.left);
                barRight = Math.max(barRight, r.right);
            });
            if (!Number.isFinite(barLeft) || barRight <= barLeft || tableRect.height < 2) return;
            svg.style.position = 'absolute';
            svg.style.left = `${Math.max(0, barLeft - wrapRect.left)}px`;
            svg.style.right = `${Math.max(0, wrapRect.right - barRight)}px`;
            svg.style.top = `${Math.max(0, tableRect.top - wrapRect.top)}px`;
            svg.style.bottom = `${Math.max(0, wrapRect.bottom - tableRect.bottom)}px`;
            svg.style.width = '';
            svg.style.height = '';
        }
        function getPrintLinkRowY(table) {
            const rowEls = table.querySelectorAll('tbody tr');
            const tableRect = table.getBoundingClientRect();
            const tableH = Math.max(1, tableRect.height);
            return rowIndex => {
                const row = rowEls[rowIndex];
                if (!row) return 50;
                const rect = row.getBoundingClientRect();
                return ((rect.top + rect.height / 2) - tableRect.top) / tableH * 100;
            };
        }
        const wrap = document.getElementById('wrap');
        const table = wrap.querySelector('.schedule-print-table');
        syncPrintLinkOverlay(wrap);
        window.__printLinkRowY = getPrintLinkRowY(table);
        window.__printLinkPathCount = wrap.querySelectorAll('.print-inline-links path').length;
    </script>
</body>
</html>
