<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print Link Align Fixture</title>
    <style>
        .print-schedule-wrap {
            position: relative;
            width: 100%;
            --print-row-height: 24px;
            --gantt-link-color: #94a3b8;
            --gantt-link-width: 2px;
        }
        .schedule-print-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-family: Arial, sans-serif;
            font-size: 8pt;
        }
        .schedule-print-table th,
        .schedule-print-table td {
            border: 1px solid #999;
            padding: 3px 5px;
            vertical-align: middle;
            height: var(--print-row-height);
        }
        .print-bar-cell {
            padding: 1px 0 !important;
            position: relative;
            overflow: visible;
            border-left: 1px solid #999 !important;
        }
        .print-ts-row td { padding: 0 !important; }
        .print-timescale { position: relative; height: 14px; background: #eee; }
        .print-bar-track {
            position: relative;
            width: 100%;
            height: var(--print-row-height);
            overflow: visible;
        }
        .print-bar {
            position: absolute;
            top: 7px;
            height: 10px;
            background: #2563eb;
            z-index: 2;
        }
        .print-row-links {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
            z-index: 1;
        }
        .print-row-links path {
            stroke: var(--gantt-link-color);
            stroke-width: var(--gantt-link-width);
            fill: none;
        }
        .print-row-links polygon {
            fill: var(--gantt-link-color);
        }
    </style>
</head>
<body>
    <div class="print-schedule-wrap" id="wrap">
        <table class="schedule-print-table">
            <colgroup>
                <col style="width:120px">
                <col style="width:80px">
                <col class="print-bar-col">
            </colgroup>
            <thead>
                <tr>
                    <th>Activity</th>
                    <th>Duration</th>
                    <th class="print-bar-cell">Schedule Bars</th>
                </tr>
                <tr class="print-ts-row">
                    <td colspan="2"></td>
                    <td class="print-bar-cell"><div class="print-timescale"></div></td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Task A</td>
                    <td>5d</td>
                    <td class="print-bar-cell"><div class="print-bar-track"><svg class="print-row-links" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M 40 50 L 43 50" fill="none" stroke="#94a3b8" stroke-width="2"/><path d="M 43 50 L 43 100" fill="none" stroke="#94a3b8" stroke-width="2"/></svg><div class="print-bar" style="left:10%;width:30%"></div></div></td>
                </tr>
                <tr>
                    <td>Task B</td>
                    <td>8d</td>
                    <td class="print-bar-cell"><div class="print-bar-track"><svg class="print-row-links" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M 43 0 L 43 50 L 55 50" fill="none" stroke="#94a3b8" stroke-width="2"/><polygon points="55,50 52.2,48.7 52.2,51.3" fill="#94a3b8"/></svg><div class="print-bar" style="left:45%;width:25%"></div></div></td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        function getRowLinkMetrics(table, rowIndex) {
            const row = table.querySelectorAll('tbody tr')[rowIndex];
            const track = row.querySelector('.print-bar-track');
            const bar = row.querySelector('.print-bar');
            const svg = row.querySelector('.print-row-links');
            const trackRect = track.getBoundingClientRect();
            const barRect = bar.getBoundingClientRect();
            const svgRect = svg.getBoundingClientRect();
            const barLeftPct = ((barRect.left - trackRect.left) / trackRect.width) * 100;
            const barRightPct = ((barRect.right - trackRect.left) / trackRect.width) * 100;
            return {
                svgMatchesTrack: Math.abs(svgRect.left - trackRect.left) <= 1
                    && Math.abs(svgRect.width - trackRect.width) <= 1,
                barLeftPct,
                barRightPct
            };
        }
        const table = document.querySelector('.schedule-print-table');
        window.__printLinkMetrics = {
            row0: getRowLinkMetrics(table, 0),
            row1: getRowLinkMetrics(table, 1),
            pathCount: document.querySelectorAll('.print-row-links path').length,
            arrowCount: document.querySelectorAll('.print-row-links polygon').length
        };
    </script>
</body>
</html>
