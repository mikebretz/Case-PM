<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print Link Align Fixture</title>
    <style>
        .print-schedule-wrap {
            position: relative;
            width: 100%;
            --print-cols-width: 200px;
            --print-row-height: 24px;
            --print-links-top: 38px;
            --print-links-height: 48px;
            --gantt-link-color: #94a3b8;
            --gantt-link-width: 2px;
        }
        .schedule-print-table {
            position: relative;
            z-index: 2;
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-family: Arial, sans-serif;
            font-size: 8pt;
        }
        .schedule-print-table th,
        .schedule-print-table td {
            border: 1px solid #999;
            padding: 3px 5px;
            vertical-align: middle;
            height: var(--print-row-height);
        }
        .print-bar-cell {
            padding: 1px 0 !important;
            position: relative;
            overflow: visible;
            border-left: 1px solid #999 !important;
        }
        .print-ts-row td { padding: 0 !important; }
        .print-timescale { position: relative; height: 14px; background: #eee; }
        .print-bar-track {
            position: relative;
            width: 100%;
            height: var(--print-row-height);
            overflow: visible;
        }
        .print-bar {
            position: absolute;
            top: 7px;
            height: 10px;
            background: #2563eb;
            z-index: 2;
        }
        .print-bar-links-layer {
            position: absolute;
            left: var(--print-cols-width);
            right: 0;
            top: var(--print-links-top);
            height: var(--print-links-height);
            pointer-events: none;
            z-index: 1;
            overflow: visible;
        }
        .print-links-overlay {
            display: block;
            width: 100%;
            height: 100%;
        }
        .print-links-overlay path {
            stroke: var(--gantt-link-color);
            stroke-width: var(--gantt-link-width);
            fill: none;
        }
        .print-links-overlay polygon {
            fill: var(--gantt-link-color);
        }
    </style>
</head>
<body>
    <div class="print-schedule-wrap" id="wrap">
        <div class="print-bar-links-layer">
            <svg class="print-links-overlay" viewBox="0 0 600 48" preserveAspectRatio="none" aria-hidden="true">
                <path d="M 240 12 L 258 12 L 258 36 L 330 36" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"/>
                <polygon points="330,36 322,32.7 322,39.3" fill="#94a3b8"/>
            </svg>
        </div>
        <table class="schedule-print-table">
            <colgroup>
                <col style="width:120px">
                <col style="width:80px">
                <col class="print-bar-col">
            </colgroup>
            <thead>
                <tr>
                    <th>Activity</th>
                    <th>Duration</th>
                    <th class="print-bar-cell">Schedule Bars</th>
                </tr>
                <tr class="print-ts-row">
                    <td colspan="2"></td>
                    <td class="print-bar-cell"><div class="print-timescale"></div></td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Task A</td>
                    <td>5d</td>
                    <td class="print-bar-cell"><div class="print-bar-track"><div class="print-bar" style="left:10%;width:30%"></div></div></td>
                </tr>
                <tr>
                    <td>Task B</td>
                    <td>8d</td>
                    <td class="print-bar-cell"><div class="print-bar-track"><div class="print-bar" style="left:45%;width:25%"></div></div></td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        function getRowBarMetrics(table, rowIndex) {
            const row = table.querySelectorAll('tbody tr')[rowIndex];
            const track = row.querySelector('.print-bar-track');
            const bar = row.querySelector('.print-bar');
            const trackRect = track.getBoundingClientRect();
            const barRect = bar.getBoundingClientRect();
            const barLeftPct = ((barRect.left - trackRect.left) / trackRect.width) * 100;
            const barRightPct = ((barRect.right - trackRect.left) / trackRect.width) * 100;
            return { barLeftPct, barRightPct };
        }
        const wrap = document.getElementById('wrap');
        const table = document.querySelector('.schedule-print-table');
        const layer = document.querySelector('.print-bar-links-layer');
        const layerRect = layer.getBoundingClientRect();
        const firstTrack = table.querySelector('tbody tr .print-bar-track');
        const trackRect = firstTrack.getBoundingClientRect();
        window.__printLinkMetrics = {
            row0: {
                ...getRowBarMetrics(table, 0),
                svgMatchesTrack: Math.abs(layerRect.left - trackRect.left) <= 2
            },
            row1: getRowBarMetrics(table, 1),
            pathCount: document.querySelectorAll('.print-links-overlay path').length,
            arrowCount: document.querySelectorAll('.print-links-overlay polygon').length,
            overlayMatchesBarColumn: Math.abs(layerRect.left - trackRect.left) <= 2
                && Math.abs(layerRect.width - trackRect.width) <= 2
        };
    </script>
</body>
</html>
