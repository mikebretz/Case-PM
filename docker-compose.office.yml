# LibreOffice Online (Collabora CODE) for Case PM document editing.
#
# Usage:
#   docker compose -f docker-compose.office.yml up -d
#
# Then set on the Case PM server:
#   LIBREOFFICE_ONLINE_URL=http://localhost:9980
#   CASEPM_PUBLIC_URL=http://host.docker.internal:5000   # URL Collabora uses to fetch WOPI files
#   CASEPM_WOPI_SECRET=change-me-to-a-long-random-string
#
# Adjust `domain` below to match the hostname users use for Case PM (pipe-separated).

services:
  collabora:
    image: collabora/code:24.04.13.1.1
    container_name: casepm-collabora
    ports:
      - "9980:9980"
    environment:
      - aliasgroup1=https://localhost:443
      - extra_params=--o:ssl.enable=false --o:ssl.termination=false
      - username=
      - password=
      - dictionaries=en_US
      - DONT_GEN_SSL_CERT=true
    cap_add:
      - MKNOD
    restart: unless-stopped
