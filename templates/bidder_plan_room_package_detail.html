<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ settings.company_name }} — Bid package</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bidder-plan-room.css') }}">
</head>
<body class="pr-hub" style="--pr-accent: {{ settings.primary_color or '#059669' }}">
{% set active = 'projects' %}
{% include 'partials/bidder_plan_room_nav.html' %}
{% set header_title = 'Bid package' %}
{% include 'partials/bidder_plan_room_hub_header.html' %}
<main class="pr-hub-main pr-detail-layout" id="prPackageDetailRoot"
      data-project-id="{{ project_id }}"
      data-package-id="{{ package_id }}"
      data-approved="{{ '1' if access.approved else '0' }}"
      data-staff="{{ '1' if access.get('staff') else '0' }}"
      style="padding-top:0">
  <p class="pr-muted"><a href="/plan-room/projects/{{ project_id }}">&larr; Back to project</a></p>
  <div id="prPackageDetail"><div class="pr-loading">Loading package…</div></div>
</main>
<footer class="pr-footer pr-footer-light">&copy; {{ settings.company_name }}</footer>
<script src="{{ url_for('static', filename='js/bidder-plan-room-package-detail.js') }}"></script>
</body>
</html>
