{% extends "base.html" %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="{{ static_v('js/cost-code-import.js') }}" defer></script>
<script src="{{ static_v('js/accounting-reconcile.js') }}" defer></script>
<script src="{{ static_v('js/accounting-dialog.js') }}" defer></script>
<script src="{{ static_v('js/accounting-gl-ui.js') }}" defer></script>
<script src="{{ static_v('js/accounting-bank-ui.js') }}" defer></script>
<script src="{{ static_v('js/accounting-reports.js') }}" defer></script>
<script src="{{ static_v('js/accounting-modules-ui.js') }}" defer></script>
<script src="{{ static_v('js/accounting-payroll-ui.js') }}" defer></script>
<script src="{{ static_v('js/accounting-gl-ap-ar-ext-ui.js') }}" defer></script>
<script src="{{ static_v('js/accounting-payments-ui.js') }}" defer></script>
<script src="{{ static_v('js/accounting-consolidation-ui.js') }}" defer></script>
<script src="{{ static_v('js/accounting-platform-ui.js') }}" defer></script>
<script src="{{ static_v('js/accounting-parity-ui.js') }}" defer></script>
<script src="{{ static_v('js/accounting-waves-17-ui.js') }}" defer></script>
<script src="{{ static_v('js/accounting-tier-ui.js') }}" defer></script>
<script src="{{ static_v('js/accounting-chunks-ui.js') }}" defer></script>
<script src="{{ static_v('js/accounting-cost-codes-ui.js') }}" defer></script>
<script src="{{ static_v('js/accounting-app.js') }}" defer></script>

<style>
  /* Full viewport height: main content hosts accounting as a flex column (see accounting-app init). */
  #mainContent.accounting-main-host {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 0;
  }
  .accounting-page {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    width: 100%;
    height: 100%;
    padding: 0.5rem 1rem 1rem;
    box-sizing: border-box;
    overflow: hidden;
  }
  @media (min-width: 768px) {
    .accounting-page { padding: 1rem; }
  }
  .acct-layout { display: flex; flex: 1; min-height: 0; gap: 0; }
  .acct-sidebar { width: 15rem; flex-shrink: 0; border-right: 1px solid #3f3f46; background: #18181b; overflow-y: auto; min-height: 0; }
  .acct-main { flex: 1; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .acct-nav-btn { width: 100%; text-align: left; padding: 0.5rem 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; color: #a1a1aa; }
  .acct-nav-btn:hover { background: #27272a; color: #fff; }
  .acct-nav-btn.active { background: #065f46; color: #fff; }
  .acct-panel-body {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 1rem;
  }
  .acct-module-root {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .acct-module-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .acct-reports-layout {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  @media (min-width: 1024px) {
    .acct-reports-layout { flex-direction: row; }
  }
  .acct-reports-sidebar {
    flex-shrink: 0;
    overflow-y: auto;
    min-height: 0;
    max-height: 100%;
  }
  @media (min-width: 1024px) {
    .acct-reports-sidebar { width: 18rem; max-height: none; }
  }
  .acct-reports-main {
    flex: 1;
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #acctReportOutput {
    flex: 1;
    min-height: 0;
    overflow: auto;
    border: 1px solid #3f3f46;
    border-radius: 0.5rem;
    padding: 0.75rem;
    background: rgba(24, 24, 27, 0.5);
  }
  #acctReportOutput .acct-report-table-wrap {
    max-height: none !important;
    height: 100%;
    min-height: 12rem;
    overflow: auto;
  }
  .status-live { color: #34d399; }
  .status-beta { color: #fbbf24; }
  .status-planned { color: #71717a; }
</style>

<div class="accounting-page">
  <div class="flex items-center justify-between flex-shrink-0 mb-3 px-1">
    <div>
      <h1 class="text-2xl font-semibold text-white">Accounting</h1>
      <p class="text-xs text-zinc-500">Built-in ERP — General Ledger, AP, AR, Bank, and operations modules</p>
    </div>
    <div class="flex items-center gap-2">
      <span id="acctLedgerBadge" class="text-xs px-3 py-1 rounded-full bg-zinc-800 border border-zinc-700 text-zinc-400">—</span>
      <button type="button" id="acctRefreshBtn" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-md text-sm"><i class="fa-solid fa-rotate"></i></button>
    </div>
  </div>

  <div class="acct-layout flex-1 min-h-0 bg-zinc-900 border border-zinc-700 rounded-lg overflow-hidden">
    <aside class="acct-sidebar p-3 overflow-y-auto hidden md:block">
      <div class="text-[10px] uppercase tracking-wide text-zinc-500 mb-2 px-2">Modules</div>
      <nav id="acctModuleNav" class="space-y-0.5"></nav>
      <div class="border-t border-zinc-800 mt-4 pt-3 px-2">
        <a href="{{ url_for('program_settings') }}?tab=sage" class="text-[11px] text-zinc-500 hover:text-emerald-400 block">
          <i class="fa-solid fa-plug mr-1"></i> Optional Sage 300 sync → Settings
        </a>
      </div>
    </aside>

    <div class="acct-main">
      <div class="md:hidden flex gap-1 p-2 border-b border-zinc-800 overflow-x-auto" id="acctModuleNavMobile"></div>
      <div class="acct-panel-body" id="acctPanelRoot">
        <p class="text-zinc-500 text-sm">Loading…</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
