<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transmittal Acknowledgment — Case PM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-zinc-900 border border-zinc-700 rounded-xl p-8 text-center">
    {% if ok %}
    <div class="text-emerald-400 text-4xl mb-4">✓</div>
    <h1 class="text-xl font-semibold mb-2">Thank you</h1>
    <p class="text-zinc-400 text-sm">Transmittal acknowledged successfully.</p>
  {% else %}
    <div class="text-red-400 text-4xl mb-4">✕</div>
    <h1 class="text-xl font-semibold mb-2">Unable to acknowledge</h1>
    <p class="text-zinc-400 text-sm">{{ error or 'Invalid or expired link.' }}</p>
    {% endif %}
  </div>
</body>
</html>
