{% extends "base.html" %}

{% block content %}
<!-- Luckysheet (Excel-like spreadsheet) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/css/pluginsCss.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/plugins.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/css/luckysheet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/assets/iconfont/iconfont.css">
<script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/js/plugin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/luckysheet.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luckyexcel@1.0.1/dist/luckyexcel.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  #mainContent { display: flex !important; flex-direction: column !important; min-height: 0 !important; overflow: hidden !important; padding: 0.5rem !important; }
.sheet-page { display: flex; flex-direction: column; flex: 1; min-height: 0; width: 100%; height: 100%; box-sizing: border-box; }
  .sheet-toolbar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; flex-shrink: 0; margin-bottom: 0.5rem; }
  .sheet-btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.45rem 0.8rem; border-radius: 0.375rem; font-size: 0.85rem; font-weight: 500; background: #27272a; border: 1px solid #3f3f46; color: #fff; }
  .sheet-btn:hover { background: #3f3f46; }
  .sheet-btn.primary { background: #059669; border-color: #059669; }
  .sheet-btn.primary:hover { background: #10b981; }
  #sheetNameInput { background: #18181b; border: 1px solid #3f3f46; border-radius: 0.375rem; padding: 0.4rem 0.7rem; color: #fff; font-size: 0.9rem; min-width: 240px; }
  #luckysheetHost { position: relative; flex: 1; min-height: 360px; height: 0; width: 100%; background: #fff; border: 1px solid #3f3f46; border-radius: 0.375rem; overflow: hidden; }
  /* Luckysheet needs an absolutely-positioned container */
  #luckysheet { position: absolute; inset: 0; background: #fff; }
  #sheetStatus { font-size: 0.75rem; color: #71717a; margin-left: auto; }
  #sheetLoading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #f4f4f5; z-index: 5; color: #52525b; }
  .sheet-zoom { display: inline-flex; align-items: center; gap: 0.35rem; background: #18181b; border: 1px solid #3f3f46; border-radius: 0.375rem; padding: 0.2rem 0.4rem; }
  .sheet-zoom-btn { color: #d4d4d8; padding: 0.15rem 0.35rem; border-radius: 0.25rem; }
  .sheet-zoom-btn:hover { background: #3f3f46; }
  #sheetZoomLabel { font-size: 0.75rem; color: #a1a1aa; min-width: 38px; text-align: center; }

  /* Green Luckysheet toolbar with WHITE icons/text so everything is readable */
  .luckysheet-wa-editor,
  .luckysheet-wa-editor .luckysheet-toolbar-menu { background: #0f3d2e !important; }
  .luckysheet-wa-editor .luckysheet-toolbar-button-inner-box i,
  .luckysheet-wa-editor .luckysheet-toolbar-menu-button-inner-box i,
  .luckysheet-wa-editor .iconfont,
  .luckysheet-wa-editor .luckysheet-toolbar-menu-button-caption,
  .luckysheet-wa-editor .luckysheet-toolbar-combo-button-input,
  .luckysheet-wa-editor .luckysheet-toolbar-select-input,
  .luckysheet-wa-editor .luckysheet-toolbar-button span,
  .luckysheet-wa-editor > span { color: #eafff5 !important; }
  .luckysheet-wa-editor .luckysheet-toolbar-combo-button-input,
  .luckysheet-wa-editor .luckysheet-toolbar-select-input {
    background: rgba(255,255,255,0.12) !important;
    border-color: rgba(255,255,255,0.25) !important;
  }
  .luckysheet-wa-editor .luckysheet-toolbar-button:hover,
  .luckysheet-wa-editor .luckysheet-toolbar-menu-button:hover { background: #14532d !important; }
  .luckysheet-wa-editor .luckysheet-toolbar-separator { border-color: rgba(255,255,255,0.22) !important; }
  .luckysheet-wa-editor .luckysheet-toolbar-button-inner-box i,
  .luckysheet-wa-editor .luckysheet-toolbar-menu-button-inner-box i { font-size: 16px !important; }
  .luckysheet-wa-editor .luckysheet-toolbar-button { min-width: 26px; }
  .luckysheet-grid-window, .luckysheet-cell-main { background: #fff !important; }

  .sheet-secondary-bar {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    flex-shrink: 0; margin-bottom: 0.45rem; padding: 0.45rem 0.55rem;
    background: #18181b; border: 1px solid #3f3f46; border-radius: 0.375rem;
  }
  .sheet-secondary-bar label { font-size: 0.75rem; color: #a1a1aa; white-space: nowrap; }
  .sheet-secondary-bar select {
    background: #27272a; border: 1px solid #3f3f46; border-radius: 0.375rem;
    color: #fff; font-size: 0.8rem; padding: 0.3rem 0.5rem; min-width: 170px;
  }
  .sheet-secondary-bar .sheet-mini-btn {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.32rem 0.55rem; border-radius: 0.375rem; font-size: 0.75rem;
    background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7;
  }
  .sheet-secondary-bar .sheet-mini-btn:hover { background: #3f3f46; }
  .sheet-secondary-bar .sheet-mini-btn.active { border-color: #10b981; color: #6ee7b7; }
  #sheetPrintAreaLabel { font-size: 0.75rem; color: #a1a1aa; margin-right: auto; min-width: 180px; }
  .sheet-format-hint { font-size: 0.7rem; color: #71717a; }
</style>

<div class="sheet-page">
  <div class="sheet-toolbar">
    <button type="button" id="sheetBackBtn" class="sheet-btn" title="Back to Documents"><i class="fa-solid fa-arrow-left"></i><span class="hidden md:inline">Documents</span></button>
    <i class="fa-solid fa-table-cells text-emerald-400"></i>
    <input type="text" id="sheetNameInput" placeholder="Untitled Spreadsheet">
    <button type="button" id="sheetSaveBtn" class="sheet-btn primary"><i class="fa-solid fa-floppy-disk"></i> Save to Documents</button>
    <button type="button" id="sheetPrintBtn" class="sheet-btn"><i class="fa-solid fa-print"></i><span class="hidden md:inline"> Print</span></button>
    <button type="button" id="sheetExportBtn" class="sheet-btn"><i class="fa-solid fa-file-excel"></i><span class="hidden md:inline"> Export .xlsx</span></button>
    <button type="button" id="sheetImportBtn" class="sheet-btn"><i class="fa-solid fa-file-import"></i><span class="hidden md:inline"> Import</span></button>
    <input type="file" id="sheetImportInput" accept=".xlsx,.xls,.csv" class="hidden">
    <div class="sheet-zoom" title="Ctrl + scroll to zoom the cells">
      <button type="button" id="sheetZoomOut" class="sheet-zoom-btn"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
      <span id="sheetZoomLabel">100%</span>
      <button type="button" id="sheetZoomIn" class="sheet-zoom-btn"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
    </div>
    <span id="sheetStatus">New spreadsheet</span>
  </div>
  <div class="sheet-secondary-bar" aria-label="Cell formatting and print area">
    <label for="sheetFormatSelect">Cell format</label>
    <select id="sheetFormatSelect" title="Select cells, then choose a format">
      <option value="general">General</option>
      <option value="usd">Currency — US Dollar ($)</option>
      <option value="usd_accounting">Accounting — US Dollar ($)</option>
      <option value="yen">Currency — Japanese Yen (¥)</option>
      <option value="eur">Currency — Euro (€)</option>
      <option value="gbp">Currency — British Pound (£)</option>
      <option value="percent">Percent (%)</option>
      <option value="number2">Number — 1,234.56</option>
      <option value="number0">Number — 1,234</option>
      <option value="date_mdy">Date — MM/DD/YYYY</option>
      <option value="date_ymd">Date — YYYY-MM-DD</option>
      <option value="date_dmy">Date — DD/MM/YYYY</option>
    </select>
    <button type="button" id="sheetApplyFormatBtn" class="sheet-mini-btn" title="Apply format to selected cells"><i class="fa-solid fa-check"></i> Apply</button>
    <span class="sheet-format-hint hidden sm:inline">Select cells first</span>
    <span id="sheetPrintAreaLabel">Print area: auto (used cells)</span>
    <button type="button" id="sheetSetPrintAreaBtn" class="sheet-mini-btn" title="Use current selection as print area"><i class="fa-solid fa-vector-square"></i> Set print area</button>
    <button type="button" id="sheetClearPrintAreaBtn" class="sheet-mini-btn" title="Print all used cells again"><i class="fa-solid fa-eraser"></i> Clear</button>
    <button type="button" id="sheetPrintPreviewBtn" class="sheet-mini-btn" title="Preview exactly what will print"><i class="fa-solid fa-eye"></i> Print preview</button>
  </div>
  <div id="luckysheetHost">
    <div id="luckysheet"></div>
    <div id="sheetLoading"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Loading editor…</div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);
  let docId = params.get('doc_id') ? parseInt(params.get('doc_id'), 10) : null;
  const projectId = {{ active_project.id if active_project else 'null' }};
  const nameInput = document.getElementById('sheetNameInput');
  const statusEl = document.getElementById('sheetStatus');
  const loadingEl = document.getElementById('sheetLoading');

  function setStatus(t) { statusEl.textContent = t; }
  function hideLoading() { loadingEl.style.display = 'none'; }

  let dirty = false;
  let allowUnload = false;
  let customPrintRange = null;

  const FORMAT_PRESETS = {
    general: { fa: 'General', t: 'g' },
    usd: { fa: '$#,##0.00', t: 'n' },
    usd_accounting: { fa: '_("$"* #,##0.00_);_("$"* \\(#,##0.00\\);_("$"* "-"??_);_(@_)', t: 'n' },
    yen: { fa: '¥#,##0', t: 'n' },
    eur: { fa: '€#,##0.00', t: 'n' },
    gbp: { fa: '£#,##0.00', t: 'n' },
    percent: { fa: '0.00%', t: 'n' },
    number2: { fa: '#,##0.00', t: 'n' },
    number0: { fa: '#,##0', t: 'n' },
    date_mdy: { fa: 'm/d/yyyy', t: 'd' },
    date_ymd: { fa: 'yyyy-mm-dd', t: 'd' },
    date_dmy: { fa: 'd/m/yyyy', t: 'd' },
  };

  function setDirty(v) {
    dirty = v;
    if (v) setStatus('Unsaved changes');
  }

  const BASE_OPTIONS = {
    container: 'luckysheet',
    lang: 'en',
    showinfobar: false,
    showtoolbar: true,
    showsheetbar: true,
    showstatisticBar: true,
    sheetFormulaBar: true,
    allowCopy: true,
    allowEdit: true,
    showConfigWindowResize: true,
    showsheetbarConfig: { add: true, menu: true, sheet: true },
    enableAddRow: true,
    enableAddBackTop: true,
    rowHeaderWidth: 46,
    hook: {
      cellUpdated: function () { setDirty(true); },
      cellEditBefore: function () { setDirty(true); },
      rangePasteBefore: function () { setDirty(true); return true; },
      cellMousedown: function () { setTimeout(syncFormatDropdownFromSelection, 0); },
    },
  };

  function createEmpty() {
    window.luckysheet.create(Object.assign({}, BASE_OPTIONS, {
      title: nameInput.value || 'Untitled Spreadsheet',
      data: [{ name: 'Sheet1', color: '', status: 1, order: 0, index: 0, row: 100, column: 26, celldata: [], config: {} }],
    }));
    hideLoading();
    setTimeout(updatePrintAreaLabel, 250);
  }

  function createFromSheets(sheets) {
    window.luckysheet.create(Object.assign({}, BASE_OPTIONS, {
      title: nameInput.value || 'Spreadsheet',
      data: (sheets && sheets.length) ? sheets : [{ name: 'Sheet1', status: 1, order: 0, index: 0, row: 100, column: 26, celldata: [], config: {} }],
    }));
    hideLoading();
    setTimeout(updatePrintAreaLabel, 250);
  }

  function importFromExcelFile(file, name) {
    if (!window.LuckyExcel) { setStatus('Import library unavailable'); createEmpty(); return; }
    window.LuckyExcel.transformExcelToLucky(file, function (exportJson) {
      if (!exportJson || !exportJson.sheets || !exportJson.sheets.length) {
        setStatus('Could not read workbook — starting blank'); createEmpty(); return;
      }
      if (name) nameInput.value = name;
      createFromSheets(exportJson.sheets);
      setStatus('Imported ' + (name || file.name || 'workbook'));
    });
  }

  function importCsvArrayBuffer(buf, name) {
    const wb = XLSX.read(buf, { type: 'array' });
    const firstName = wb.SheetNames[0];
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[firstName], { header: 1 });
    const celldata = [];
    aoa.forEach((row, r) => row.forEach((val, c) => {
      if (val !== '' && val != null) celldata.push({ r, c, v: { v: val, m: String(val) } });
    }));
    createFromSheets([{ name: firstName || 'Sheet1', status: 1, order: 0, index: 0, row: Math.max(100, aoa.length + 10), column: 26, celldata, config: {} }]);
    if (name) nameInput.value = name;
  }

  async function loadExisting() {
    setStatus('Loading…');
    try {
      const res = await fetch(`/api/documents/${docId}/editor-content`);
      const info = await res.json();
      if (!res.ok) throw new Error(info.error || 'Load failed');
      nameInput.value = (info.name || 'Spreadsheet').replace(/\.(xlsx|xls|csv|json)$/i, '');
      if (info.editor_content) {
        try { createFromSheets(JSON.parse(info.editor_content)); setStatus('Loaded'); return; }
        catch (_) { /* fall through to file import */ }
      }
      // No saved editor state — import the stored file.
      const dl = await fetch(info.download_url);
      const buf = await dl.arrayBuffer();
      const fname = (info.original_filename || info.name || '').toLowerCase();
      if (fname.endsWith('.csv')) {
        importCsvArrayBuffer(buf, nameInput.value);
        setStatus('Imported CSV');
      } else {
        const file = new File([buf], info.original_filename || 'workbook.xlsx');
        importFromExcelFile(file, nameInput.value);
      }
    } catch (e) {
      setStatus('Error: ' + e.message);
      createEmpty();
    }
  }

  // Build an .xlsx Blob from the current Luckysheet workbook (values + formulas).
  function buildXlsxBlob() {
    const sheets = window.luckysheet.getAllSheets();
    const wb = XLSX.utils.book_new();
    sheets.forEach((s) => {
      const data = s.data || [];
      const ws = {};
      let maxR = 0, maxC = 0;
      const grid = data.length ? data : luckyCelldataToGrid(s.celldata || []);
      grid.forEach((row, r) => {
        if (!row) return;
        row.forEach((cell, c) => {
          if (cell == null) return;
          const v = (typeof cell === 'object') ? cell.v : cell;
          const f = (typeof cell === 'object') ? cell.f : null;
          if (v == null && !f) return;
          const ref = XLSX.utils.encode_cell({ r, c });
          const out = {};
          if (typeof v === 'number') { out.t = 'n'; out.v = v; }
          else if (typeof v === 'boolean') { out.t = 'b'; out.v = v; }
          else { out.t = 's'; out.v = v == null ? '' : String(v); }
          if (f) out.f = String(f).replace(/^=/, '');
          ws[ref] = out;
          if (r > maxR) maxR = r;
          if (c > maxC) maxC = c;
        });
      });
      ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: maxR, c: maxC } });
      XLSX.utils.book_append_sheet(wb, ws, (s.name || 'Sheet').slice(0, 31));
    });
    const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    return new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  function luckyCelldataToGrid(celldata) {
    const grid = [];
    celldata.forEach((c) => {
      grid[c.r] = grid[c.r] || [];
      grid[c.r][c.c] = c.v;
    });
    return grid;
  }

  async function save() {
    setStatus('Saving…');
    const name = (nameInput.value || 'Untitled Spreadsheet').trim();
    const content = JSON.stringify(window.luckysheet.getAllSheets());
    const fd = new FormData();
    if (docId) fd.append('doc_id', String(docId));
    if (projectId) fd.append('project_id', String(projectId));
    fd.append('kind', 'sheet');
    fd.append('name', name);
    fd.append('content', content);
    try {
      const blob = buildXlsxBlob();
      fd.append('file', blob, `${name}.xlsx`);
    } catch (e) { /* still save editor state without file */ }
    try {
      const res = await fetch('/api/documents/editor/save', { method: 'POST', body: fd });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Save failed');
      docId = json.id;
      const url = new URL(location.href);
      url.searchParams.set('doc_id', String(docId));
      history.replaceState(null, '', url);
      dirty = false;
      setStatus('Saved to Documents · ' + new Date().toLocaleTimeString());
      if (window.showToast) window.showToast('Saved to Documents');
      return true;
    } catch (e) {
      setStatus('Error: ' + e.message);
      alert(e.message);
      return false;
    }
  }

  // ---- Zoom (Ctrl + scroll on the cells) — drives Luckysheet's built-in zoom ----
  function refreshZoomLabel() {
    const el = document.getElementById('luckysheet-zoom-hundred');
    const txt = el && el.textContent ? el.textContent.trim() : '';
    document.getElementById('sheetZoomLabel').textContent = txt || '100%';
  }
  function stepZoom(dir) {
    const btn = document.getElementById(dir > 0 ? 'luckysheet-zoom-plus' : 'luckysheet-zoom-minus');
    if (btn) { btn.click(); setTimeout(refreshZoomLabel, 60); }
  }
  let wheelAccum = 0, wheelTimer = null;
  function bindZoom() {
    const host = document.getElementById('luckysheetHost');
    host.addEventListener('wheel', function (e) {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      // Debounce trackpad bursts so one gesture = one zoom step.
      wheelAccum += e.deltaY;
      if (wheelTimer) return;
      wheelTimer = setTimeout(() => {
        stepZoom(wheelAccum < 0 ? 1 : -1);
        wheelAccum = 0; wheelTimer = null;
      }, 40);
    }, { passive: false });
    document.getElementById('sheetZoomIn').addEventListener('click', () => stepZoom(1));
    document.getElementById('sheetZoomOut').addEventListener('click', () => stepZoom(-1));
    setTimeout(refreshZoomLabel, 800);
  }

  // ---- Cell number/date formats ----
  function colToLetter(col) {
    let n = col + 1;
    let s = '';
    while (n > 0) {
      const rem = (n - 1) % 26;
      s = String.fromCharCode(65 + rem) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  function rangeToA1(range) {
    if (!range) return '';
    const r0 = range.row[0];
    const r1 = range.row[1];
    const c0 = range.column[0];
    const c1 = range.column[1];
    if (r0 === r1 && c0 === c1) return `${colToLetter(c0)}${r0 + 1}`;
    return `${colToLetter(c0)}${r0 + 1}:${colToLetter(c1)}${r1 + 1}`;
  }

  function getSelectionRanges() {
    try {
      const ranges = window.luckysheet.getRange();
      return Array.isArray(ranges) ? ranges.filter((r) => r && r.row && r.column) : [];
    } catch (_) {
      return [];
    }
  }

  function applyFormatToSelection(presetKey) {
    const preset = FORMAT_PRESETS[presetKey];
    if (!preset || !window.luckysheet.setRangeFormat) return false;
    const ranges = getSelectionRanges();
    if (!ranges.length) {
      alert('Select one or more cells first, then choose a format.');
      return false;
    }
    ranges.forEach((range) => {
      window.luckysheet.setRangeFormat('ct', preset, { range });
    });
    setDirty(true);
    return true;
  }

  function detectFormatPresetFromCell(cell) {
    if (!cell || !cell.ct || !cell.ct.fa) return 'general';
    const fa = String(cell.ct.fa);
    const entries = Object.entries(FORMAT_PRESETS);
    for (let i = 0; i < entries.length; i++) {
      if (entries[i][1].fa === fa) return entries[i][0];
    }
    if (fa.indexOf('¥') >= 0 || fa.indexOf('￥') >= 0) return 'yen';
    if (fa.indexOf('€') >= 0) return 'eur';
    if (fa.indexOf('£') >= 0) return 'gbp';
    if (fa.indexOf('$') >= 0) return fa.indexOf('_(') >= 0 ? 'usd_accounting' : 'usd';
    if (fa.indexOf('%') >= 0) return 'percent';
    if (fa === 'm/d/yyyy') return 'date_mdy';
    if (fa === 'yyyy-mm-dd') return 'date_ymd';
    if (fa === 'd/m/yyyy') return 'date_dmy';
    return 'general';
  }

  function syncFormatDropdownFromSelection() {
    const sel = document.getElementById('sheetFormatSelect');
    if (!sel) return;
    const ranges = getSelectionRanges();
    if (!ranges.length) return;
    const grid = window.luckysheet.getSheetData() || [];
    const r = ranges[0].row[0];
    const c = ranges[0].column[0];
    const cell = grid[r] && grid[r][c];
    sel.value = detectFormatPresetFromCell(cell);
  }

  function updatePrintAreaLabel() {
    const el = document.getElementById('sheetPrintAreaLabel');
    if (!el) return;
    if (customPrintRange) {
      el.textContent = `Print area: ${rangeToA1(customPrintRange)}`;
      el.title = 'Only this range will print. Click Clear to reset.';
      return;
    }
    const auto = getAutoPrintRange();
    el.textContent = auto.hasContent
      ? `Print area: auto ${rangeToA1(auto.range)}`
      : 'Print area: auto (used cells)';
    el.title = 'Select cells and click Set print area to override.';
  }

  function setPrintAreaFromSelection() {
    const ranges = getSelectionRanges();
    if (!ranges.length) {
      alert('Select the cells you want to print, then click Set print area.');
      return;
    }
    if (ranges.length > 1) {
      alert('Select a single rectangular area for the print area.');
      return;
    }
    customPrintRange = {
      row: ranges[0].row.slice(),
      column: ranges[0].column.slice(),
    };
    updatePrintAreaLabel();
    setStatus(`Print area set to ${rangeToA1(customPrintRange)}`);
  }

  function clearPrintArea() {
    customPrintRange = null;
    updatePrintAreaLabel();
    setStatus('Print area reset to auto (used cells)');
  }

  // ---- Print current sheet (WYSIWYG: match on-screen formatting) ----
  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function getActiveSheet() {
    const sheets = window.luckysheet.getAllSheets();
    return sheets.find((s) => s.status === 1) || sheets[0] || null;
  }

  function cellHasPrintableContent(cell) {
    if (!cell || typeof cell !== 'object') return false;
    if (cell.mc && cell.mc.rs == null) return false;
    if (cell.f) return true;
    if (cell.m != null && String(cell.m).trim() !== '') return true;
    if (cell.v != null && String(cell.v).trim() !== '') return true;
    if (cell.bg || cell.fc || cell.bl || cell.it || cell.fs || cell.ff || cell.bd) return true;
    if (cell.ct && cell.ct.fa && cell.ct.fa !== 'General') return true;
    return false;
  }

  function getAutoPrintRange() {
    let grid = [];
    try { grid = window.luckysheet.getSheetData() || []; } catch (_) { grid = []; }
    const sheet = getActiveSheet();
    const config = (sheet && sheet.config) || {};
    let minR = Infinity;
    let maxR = -1;
    let minC = Infinity;
    let maxC = -1;
    let hasContent = false;

    function bump(r, c) {
      if (r < minR) minR = r;
      if (r > maxR) maxR = r;
      if (c < minC) minC = c;
      if (c > maxC) maxC = c;
      hasContent = true;
    }

    grid.forEach((row, r) => {
      if (!row) return;
      row.forEach((cell, c) => {
        if (cellHasPrintableContent(cell)) bump(r, c);
      });
    });

    const merges = config.merge || {};
    Object.keys(merges).forEach((key) => {
      const m = merges[key];
      if (!m || m.r == null || m.c == null) return;
      const rs = m.rs || 1;
      const cs = m.cs || 1;
      bump(m.r, m.c);
      bump(m.r + rs - 1, m.c + cs - 1);
    });

    if (!hasContent) {
      return { hasContent: false, range: { row: [0, 0], column: [0, 0] } };
    }
    return {
      hasContent: true,
      range: { row: [minR, maxR], column: [minC, maxC] },
    };
  }

  function getPrintRange() {
    if (customPrintRange) return customPrintRange;
    return getAutoPrintRange().range;
  }

  function borderCss(side) {
    if (!side || side.style == null || Number(side.style) === 0) return '';
    const color = side.color || '#000000';
    const width = Number(side.style) >= 8 ? '2px' : '1px';
    return `${width} solid ${color}`;
  }

  function cellInlineStyle(cell, config, r, c) {
    const rowlen = (config && config.rowlen) || {};
    const columnlen = (config && config.columnlen) || {};
    let style = '';
    const rh = rowlen[String(r)];
    const cw = columnlen[String(c)];
    if (rh) style += `height:${rh}px;`;
    if (cw) style += `width:${cw}px;min-width:${cw}px;`;
    if (!cell || typeof cell !== 'object') return style;

    if (cell.bg) style += `background-color:${cell.bg};`;
    if (cell.fc) style += `color:${cell.fc};`;
    if (cell.fs) style += `font-size:${cell.fs}pt;`;
    if (cell.ff) style += `font-family:${cell.ff};`;
    if (cell.bl) style += 'font-weight:bold;';
    if (cell.it) style += 'font-style:italic;';
    if (cell.un) style += 'text-decoration:underline;';
    if (cell.cl) style += 'text-decoration:line-through;';

    const ht = cell.ht;
    if (ht === 0) style += 'text-align:center;';
    else if (ht === 2) style += 'text-align:right;';
    else style += 'text-align:left;';

    const vt = cell.vt;
    if (vt === 0) style += 'vertical-align:middle;';
    else if (vt === 2) style += 'vertical-align:bottom;';
    else style += 'vertical-align:top;';

    if (cell.tb === 2) style += 'white-space:normal;word-wrap:break-word;';
    else style += 'white-space:pre-wrap;';

    if (cell.bd) {
      const top = borderCss(cell.bd.t);
      const right = borderCss(cell.bd.r);
      const bottom = borderCss(cell.bd.b);
      const left = borderCss(cell.bd.l);
      if (top) style += `border-top:${top};`;
      if (right) style += `border-right:${right};`;
      if (bottom) style += `border-bottom:${bottom};`;
      if (left) style += `border-left:${left};`;
    }
    return style;
  }

  function cellDisplayValue(cell) {
    if (!cell) return '';
    if (cell.m != null && cell.m !== '') return cell.m;
    if (cell.v != null && cell.v !== '') return cell.v;
    return '';
  }

  function buildFormattedPrintTable(range) {
    const grid = window.luckysheet.getSheetData() || [];
    const sheet = getActiveSheet();
    const config = (sheet && sheet.config) || {};
    const merges = config.merge || {};
    const mergeAnchors = {};
    const mergeSlaves = {};

    Object.keys(merges).forEach((key) => {
      const m = merges[key];
      if (!m || m.r == null || m.c == null) return;
      const rs = m.rs || 1;
      const cs = m.cs || 1;
      mergeAnchors[`${m.r}_${m.c}`] = { rs, cs };
      for (let rr = m.r; rr < m.r + rs; rr++) {
        for (let cc = m.c; cc < m.c + cs; cc++) {
          if (rr !== m.r || cc !== m.c) mergeSlaves[`${rr}_${cc}`] = true;
        }
      }
    });

    const minR = range.row[0];
    const maxR = range.row[1];
    const minC = range.column[0];
    const maxC = range.column[1];
    let colgroup = '';
    for (let c = minC; c <= maxC; c++) {
      const w = config.columnlen && config.columnlen[String(c)];
      colgroup += w ? `<col style="width:${w}px">` : '<col style="width:72px">';
    }

    let rows = '';
    for (let r = minR; r <= maxR; r++) {
      rows += '<tr>';
      for (let c = minC; c <= maxC; c++) {
        const key = `${r}_${c}`;
        if (mergeSlaves[key]) continue;
        const cell = grid[r] && grid[r][c];
        const anchor = mergeAnchors[key];
        const span = anchor
          ? ` rowspan="${anchor.rs}" colspan="${anchor.cs}"`
          : '';
        const style = cellInlineStyle(cell, config, r, c);
        const value = escapeHtml(cellDisplayValue(cell));
        rows += `<td${span} style="${style}">${value}</td>`;
      }
      rows += '</tr>';
    }
    return `<table class="sheet-print-table">${colgroup}${rows}</table>`;
  }

  function buildPrintDocumentHtml(tableHtml, meta) {
    meta = meta || {};
    const title = meta.title || escapeHtml(nameInput.value || 'Spreadsheet');
    const areaLabel = meta.areaLabel || '';
    const preview = !!meta.preview;
    const previewBanner = preview
      ? `<div class="preview-banner">
           <strong>Print preview</strong> — showing exactly what will print (${areaLabel || 'selected area'}).
           <button type="button" onclick="window.print()">Print now</button>
         </div>`
      : '';
    return `<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>${title}</title>
<style>
  @page { margin: 0.45in; }
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { font-family: Calibri, Arial, sans-serif; padding: 0.2in; }
  h1 { font-size: 14pt; font-weight: 600; margin: 0 0 8px; }
  .print-meta { font-size: 10pt; color: #444; margin: 0 0 10px; }
  .preview-banner {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin: 0 0 12px; padding: 10px 12px; border: 1px solid #86efac;
    background: #ecfdf5; color: #14532d; font-size: 10pt;
  }
  .preview-banner button {
    margin-left: auto; padding: 6px 12px; border: 0; border-radius: 6px;
    background: #059669; color: #fff; font-size: 10pt; cursor: pointer;
  }
  .print-scale-wrap { overflow: visible; width: 100%; }
  table.sheet-print-table,
  table[data-type="luckysheet_copy_action_table"] {
    border-collapse: collapse;
    table-layout: fixed;
    width: auto;
    max-width: none;
    transform-origin: top left;
  }
  table.sheet-print-table td,
  table[data-type="luckysheet_copy_action_table"] td {
    box-sizing: border-box;
    padding: 1px 4px;
    overflow: hidden;
    vertical-align: top;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  @media print {
    body { padding: 0; }
    h1 { margin-bottom: 6px; }
    .preview-banner { display: none !important; }
  }
</style>
</head><body>
${previewBanner}
<h1>${title}</h1>
${areaLabel ? `<div class="print-meta">Print area: ${areaLabel}</div>` : ''}
<div class="print-scale-wrap" id="printScaleWrap">${tableHtml}</div>
<script>
(function () {
  function fitPrintTable() {
    var wrap = document.getElementById('printScaleWrap');
    var table = wrap && wrap.querySelector('table');
    if (!table) return;
    var printable = Math.max(640, (window.innerWidth || 800) - 48);
    var tableWidth = table.scrollWidth || table.offsetWidth;
    if (tableWidth > printable) {
      var scale = printable / tableWidth;
      table.style.transform = 'scale(' + scale + ')';
      table.style.transformOrigin = 'top left';
      wrap.style.height = (table.offsetHeight * scale + 8) + 'px';
    }
  }
  window.addEventListener('load', fitPrintTable);
  window.addEventListener('resize', fitPrintTable);
})();
<\/script>
</body></html>`;
  }

  function buildPrintTableHtml(range) {
    let tableHtml = '';
    try {
      if (window.luckysheet.getRangeHtml) {
        tableHtml = window.luckysheet.getRangeHtml({ range }) || '';
      }
    } catch (_) { tableHtml = ''; }

    if (!tableHtml || !String(tableHtml).includes('<table')) {
      tableHtml = buildFormattedPrintTable(range);
    }
    return tableHtml;
  }

  function openPrintWindow(options) {
    options = options || {};
    const range = getPrintRange();
    const areaLabel = rangeToA1(range);
    let tableHtml = '';
    try { tableHtml = buildPrintTableHtml(range); }
    catch (e) {
      alert('Could not prepare print preview: ' + e.message);
      return;
    }

    const w = window.open('', '_blank');
    if (!w) {
      alert('Pop-up blocked. Allow pop-ups to print this spreadsheet.');
      return;
    }
    w.document.open();
    w.document.write(buildPrintDocumentHtml(tableHtml, {
      title: escapeHtml(nameInput.value || 'Spreadsheet'),
      areaLabel: escapeHtml(areaLabel),
      preview: !!options.preview,
    }));
    w.document.close();
    w.focus();
    if (!options.preview) {
      setTimeout(() => {
        try { w.print(); } catch (_) {}
      }, 400);
    }
  }

  function printSheet() {
    openPrintWindow({ preview: false });
  }

  function printPreview() {
    openPrintWindow({ preview: true });
  }

  function showExitDialog() {
    return new Promise((resolve) => {
      const dialog = document.createElement('dialog');
      dialog.className = 'casepm-dialog';
      dialog.innerHTML = `
        <div class="casepm-dialog-panel">
          <div class="casepm-dialog-title"><span>Save before leaving?</span></div>
          <div class="casepm-dialog-body">You have unsaved changes in this spreadsheet.</div>
          <div class="casepm-dialog-actions">
            <button type="button" class="casepm-dialog-btn casepm-dialog-btn-secondary" data-action="cancel">Cancel</button>
            <button type="button" class="casepm-dialog-btn casepm-dialog-btn-secondary" data-action="discard">Discard</button>
            <button type="button" class="casepm-dialog-btn casepm-dialog-btn-primary" data-action="save">Save to Documents</button>
          </div>
        </div>`;
      document.body.appendChild(dialog);
      if (window.CasePMDialog) {
        CasePMDialog.makeDraggable(dialog, '.casepm-dialog-title');
        CasePMDialog.open(dialog);
      } else {
        dialog.showModal();
      }
      const close = (choice) => {
        dialog.close();
        dialog.remove();
        resolve(choice);
      };
      dialog.querySelector('[data-action="cancel"]').onclick = () => close('cancel');
      dialog.querySelector('[data-action="discard"]').onclick = () => close('discard');
      dialog.querySelector('[data-action="save"]').onclick = () => close('save');
      dialog.addEventListener('cancel', (e) => { e.preventDefault(); close('cancel'); });
    });
  }

  // ---- Exit with unsaved-changes prompt ----
  async function confirmExit() {
    const target = '{{ url_for("documents_page") }}';
    if (!dirty) { allowUnload = true; window.location.href = target; return; }
    const choice = await showExitDialog();
    if (choice === 'cancel') return;
    if (choice === 'discard') {
      dirty = false;
      allowUnload = true;
      window.location.href = target;
      return;
    }
    if (choice === 'save') {
      const ok = await save();
      if (ok) {
        allowUnload = true;
        window.location.href = target;
      }
    }
  }

  function exportXlsx() {
    try {
      const blob = buildXlsxBlob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${(nameInput.value || 'spreadsheet').trim()}.xlsx`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    } catch (e) { alert('Export failed: ' + e.message); }
  }

  function waitForLuckysheet(cb, tries) {
    tries = tries || 0;
    if (window.luckysheet && window.luckysheet.create) { cb(); return; }
    if (tries > 60) { loadingEl.innerHTML = 'Spreadsheet engine failed to load. Check your connection and retry.'; return; }
    setTimeout(() => waitForLuckysheet(cb, tries + 1), 100);
  }

  document.getElementById('sheetSaveBtn').addEventListener('click', save);
  document.getElementById('sheetPrintBtn').addEventListener('click', printSheet);
  document.getElementById('sheetPrintPreviewBtn').addEventListener('click', printPreview);
  document.getElementById('sheetSetPrintAreaBtn').addEventListener('click', setPrintAreaFromSelection);
  document.getElementById('sheetClearPrintAreaBtn').addEventListener('click', clearPrintArea);
  document.getElementById('sheetApplyFormatBtn').addEventListener('click', () => {
    const key = document.getElementById('sheetFormatSelect')?.value || 'general';
    applyFormatToSelection(key);
  });
  document.getElementById('sheetFormatSelect')?.addEventListener('change', (e) => {
    applyFormatToSelection(e.target.value);
  });
  document.getElementById('sheetExportBtn').addEventListener('click', exportXlsx);
  document.getElementById('sheetBackBtn').addEventListener('click', confirmExit);
  document.getElementById('sheetNameInput').addEventListener('input', () => setDirty(true));
  document.getElementById('sheetImportBtn').addEventListener('click', () => document.getElementById('sheetImportInput').click());
  document.getElementById('sheetImportInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const nm = file.name.replace(/\.(xlsx|xls|csv)$/i, '');
    if (file.name.toLowerCase().endsWith('.csv')) {
      const reader = new FileReader();
      reader.onload = (ev) => importCsvArrayBuffer(ev.target.result, nm);
      reader.readAsArrayBuffer(file);
    } else {
      importFromExcelFile(file, nm);
    }
    e.target.value = '';
    setDirty(true);
  });
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  });
  window.addEventListener('beforeunload', (e) => {
    if (dirty && !allowUnload) { e.preventDefault(); e.returnValue = ''; }
  });

  function resizeSheetHost() {
    const host = document.getElementById('luckysheetHost');
    if (!host) return;
    const toolbarH = document.querySelector('.sheet-toolbar')?.offsetHeight || 48;
    const secondaryH = document.querySelector('.sheet-secondary-bar')?.offsetHeight || 44;
    const available = Math.max(360, window.innerHeight - toolbarH - secondaryH - 120);
    host.style.minHeight = available + 'px';
    if (window.luckysheet && window.luckysheet.resize) {
      try { window.luckysheet.resize(); } catch (_) {}
    }
  }

  waitForLuckysheet(() => {
    if (docId) loadExisting(); else createEmpty();
    bindZoom();
    resizeSheetHost();
    updatePrintAreaLabel();
    window.addEventListener('resize', resizeSheetHost);
  });
})();
</script>
{% endblock %}
