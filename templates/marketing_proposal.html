<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if proposal %}{{ proposal.title }}{% else %}Proposal{% endif %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 1rem auto; padding: 1rem; }
    .sign { margin-top: 2rem; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; }
    button { padding: 0.6rem 1.2rem; background: #059669; color: #fff; border: 0; border-radius: 6px; }
  </style>
</head>
<body>
{% if proposal %}
  <div>{{ proposal.body_html|safe }}</div>
  <div class="sign">
    <h3>Accept proposal</h3>
    <input id="sigName" placeholder="Full legal name">
    <button type="button" id="signBtn">Sign electronically</button>
    <p id="signMsg"></p>
  </div>
  <script>
    document.getElementById('signBtn')?.addEventListener('click', async () => {
      const name = document.getElementById('sigName').value;
      const res = await fetch('/api/public/marketing/proposal/{{ token }}/sign', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ signature_name: name }),
      });
      document.getElementById('signMsg').textContent = res.ok ? 'Signed — thank you!' : 'Could not sign.';
    });
  </script>
{% else %}
  <p>Proposal not found.</p>
{% endif %}
</body>
</html>
